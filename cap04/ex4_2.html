<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 4.2</title>
</head>
<body>
    <h1>Programa Cálculo do Peso Ideal</h1>
    <form>
        <p> Nome:
            <input type="text" id="inNome" required>
        </p>

        <p> Sexo:
            <input type="radio" name="inSex" id="inMasculino" required> Masculino
            <input type="radio" name="inSex" id="inFemino" required> Feminino
        </p>

        <p> Altura:
            <input type="number" step="0.01" min="0" id="inAltura" required>
        </p>
        <input type="submit" value="Calcular Peso Ideal">
        <input type="reset" value="Limpar Campos">
    </form>
    <h3></h3>
    <script src="cap04/js/ex4_2.js"></script>
    
</body>
</html>
