<script>
    const valorJantar = parseFloat(prompt("Digite o valor do jantar:"));
    const taxa = (valorJantar / 100) * 10
    const totalPagar = valorJantar + taxa;
    alert(`Valor do jantar: R$: ${valorJantar.toFixed(2)}.`);
    alert(`Taxa do Garçom: R$: ${taxa.toFixed(2)}.`);
    alert(`Total a Pagar: R$: ${totalPagar.toFixed(2)}.`);
</script>
