<script>
    const conta = Number(prompt("Digite o valor da conta:"));
    const numeroClientes = Number(prompt("Digite o número de clientes:"));
    const valor = conta / numeroClientes;
    alert(`Valor da conta R$: ${conta.toFixed(2)}\nNúmero de Clientes: ${numeroClientes}\nValor por cliente R$: ${valor.toFixed(2)}`)
</script>
