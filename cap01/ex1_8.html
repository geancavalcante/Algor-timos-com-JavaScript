<script>
    const dias = Number(prompt("Digite o número de dias da viagem:"));
    const horas = Number.parseFloat(prompt("Digite o número de horas da viagem:"));
    const totalHoras = (dias * 24) + horas;
    alert(`Sua viagem durou: ${dias}.\n${horas} horas.\nSomando tudo sua viagem teve: ${totalHoras} Horas.`)
</script>
